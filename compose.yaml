services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: lab-only-password
      POSTGRES_DB: perf_lab
    ports:
      - "127.0.0.1:55432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - jit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d perf_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
    cpus: 2.0
    mem_limit: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
  lab:
    build: .
    working_dir: /work
    entrypoint: []
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: bench
      PGPASSWORD: lab-only-password
      PGDATABASE: perf_lab
    depends_on:
      db:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - .:/work
    command: ["python3", "scripts/run_benchmark.py", "--help"]
volumes:
  pgdata:

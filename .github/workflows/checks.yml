name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build lab
      - run: docker compose run --rm lab python3 -m unittest discover -s tests -v
      - run: docker compose run --rm lab python3 scripts/run_benchmark.py --reset-data --rows 3000 --customers 100 --clients 1 2 --seconds 1 --repeats 1 --warmup 0 --output results/ci
      - name: Validate complete integration output
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path("results/ci/summary.csv").open()))
          assert len(rows) == 4, rows
          assert {r["scenario"] for r in rows} == {"baseline", "indexed"}
          assert all(int(r["transactions"]) > 0 and float(r["tps"]) > 0 for r in rows)
          assert all(float(r["p99_ms"]) >= float(r["p95_ms"]) for r in rows)
          assert Path("results/ci/REPORT.md").is_file()
          PY
      - name: Measure repeated workload
        run: docker compose run --rm lab python3 scripts/run_benchmark.py --reset-data --seconds 3 --warmup 1 --output results/full
      - name: Save benchmark reports and transaction logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-benchmark-results
          path: results/
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: docker compose down
